[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'
repositories {
  maven { url 'https://jitpack.io' }
}
dependencies {
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.github.raeleus.TenPatch:tenpatch:$tenPatchVersion"

  implementation 'com.github.pizpizi:libPVZ:v0.1.4'
  implementation 'com.github.pizpizi:pvz-skin:v0.1.1'
  implementation 'com.github.raeleus.TenPatch:tenpatch:5.2.3'
  implementation "com.fasterxml.jackson.core:jackson-databind:2.15.2"
  implementation "com.fasterxml.jackson.core:jackson-annotations:2.15.2"
  implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
  useJUnitPlatform()
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('serverJar', Jar) {
  archiveFileName = 'pvz-server.jar'

  from sourceSets.main.output

  dependsOn configurations.runtimeClasspath

  from {
    configurations.runtimeClasspath.collect { file ->
      file.isDirectory() ? file : zipTree(file)
    }
  }

  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  manifest {
    attributes(
      'Main-Class': 'com.PVZ.network.server.GameServer',
      'Multi-Release': 'true'
    )
  }
}
